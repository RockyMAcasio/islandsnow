<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island Snow</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <!-- Our stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar bg-light">
    <div class="container">

      <!-- Left side: social media icons -->
      <ul class="nav">
        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Facebook">
            <i class="bi bi-facebook"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Twitter">
            <i class="bi bi-twitter"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Pinterest">
            <i class="bi bi-pinterest"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Instagram">
            <i class="bi bi-instagram"></i>
          </a>
        </li>
      </ul>

      <!-- Right side: shopping icons and cart -->
      <ul class="nav justify-content-end align-items-center">
        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Home">
            <i class="bi bi-house-fill"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Search">
            <i class="bi bi-search"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Account">
            <i class="bi bi-person-fill"></i>
          </a>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle text-dark p-1"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-cart-fill"></i>
            My Cart
          </a>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <span class="dropdown-item-text">
                Your cart is currently empty.
              </span>
            </li>
          </ul>
        </li>
      </ul>

    </div>
  </nav>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
