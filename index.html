<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island Snow</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <!-- Our stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar bg-light">
    <div class="container">

      <!-- Left side: social media icons -->
      <ul class="nav">
        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Facebook">
            <i class="bi bi-facebook"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Twitter">
            <i class="bi bi-twitter"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Pinterest">
            <i class="bi bi-pinterest"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Instagram">
            <i class="bi bi-instagram"></i>
          </a>
        </li>
      </ul>

      <!-- Right side: shopping icons and cart -->
      <ul class="nav justify-content-end align-items-center">
        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Home">
            <i class="bi bi-house-fill"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Search">
            <i class="bi bi-search"></i>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-dark p-1" href="#" aria-label="Account">
            <i class="bi bi-person-fill"></i>
          </a>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle text-dark p-1"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-cart-fill"></i>
            My Cart
          </a>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <span class="dropdown-item-text">
                Your cart is currently empty.
              </span>
            </li>
          </ul>
        </li>
      </ul>

    </div>
  </nav>

  <main class="container">

  <!-- Island Snow logo -->
  <div class="row">
    <div class="col">
      <img
        src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-islandsnow-bootstrap-logo.png"
        alt="Island Snow logo"
        class="img-fluid rounded mx-auto d-block py-1"
      >
    </div>
  </div>

  <!-- Second menu -->
  <div class="row justify-content-center pt-4 pb-4 text-center">
    <div class="col-auto">
      <a href="#" class="text-dark text-decoration-none">
        MEN <i class="bi bi-chevron-down"></i>
      </a>
    </div>

    <div class="col-auto">
      <a href="#" class="text-dark text-decoration-none">
        WOMEN <i class="bi bi-chevron-down"></i>
      </a>
    </div>

    <div class="col-auto">
      <a href="#" class="text-dark text-decoration-none">
        KIDS <i class="bi bi-chevron-down"></i>
      </a>
    </div>

    <div class="col-auto">
      <a href="#" class="text-dark text-decoration-none">
        BRANDS <i class="bi bi-chevron-down"></i>
      </a>
    </div>

    <div class="col-auto">
      <a href="#" class="text-dark text-decoration-none">
        SEARCH
      </a>
    </div>
  </div>

  <!-- Main photo -->
  <div class="row justify-content-center">
    <div class="col">
      <img
        src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-islandsnow-bootstrap-main.png"
        alt="Model sitting on a bridge wearing Island Snow clothing"
        class="img-fluid w-100"
      >
    </div>
  </div>

</main>

<footer class="py-5">
  <div class="container">
    <div class="row">

      <!-- First column -->
      <div class="col-md-4 mb-4">
        <h5>NAVIGATION</h5>
        <hr>

        <ul class="list-unstyled">
          <li class="mb-2">
            <a href="#">About Us</a>
          </li>
          <li class="mb-2">
            <a href="#">Employment</a>
          </li>
          <li class="mb-2">
            <a href="#">Videos</a>
          </li>
        </ul>
      </div>

      <!-- Second column -->
      <div class="col-md-4 mb-4">
        <h5>MAIN MENU</h5>
        <hr>

        <ul class="list-unstyled">
          <li class="mb-2">
            <a href="#">Men</a>
          </li>
          <li class="mb-2">
            <a href="#">Women</a>
          </li>
          <li class="mb-2">
            <a href="#">Kids</a>
          </li>
          <li class="mb-2">
            <a href="#">Brands</a>
          </li>
        </ul>
      </div>

      <!-- Third column -->
      <div class="col-md-4 mb-4">
        <h5>CONNECT</h5>
        <hr>

        <p>Sign up for the latest updates.</p>

        <label for="footer-email" class="visually-hidden">
          Email address
        </label>

        <input
          type="text"
          id="footer-email"
          class="form-control mb-3"
          placeholder="Enter Email Address"
        >

        <button type="button" class="btn btn-dark">
          Join
        </button>
      </div>

    </div>
  </div>
</footer>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
